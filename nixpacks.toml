# DeepSleep AI — build frontend + API (Railway Railpack / Nixpacks)
[phases.setup]
nixPkgs = ["python312", "nodejs_20"]

[phases.install]
cmds = [
  "pip install -r requirements-prod.txt -r requirements-api.txt",
  "cd frontend && npm ci",
]

[phases.build]
cmds = ["cd frontend && npm run build"]

[start]
cmd = "uvicorn src.api.main:app --host 0.0.0.0 --port $PORT"
